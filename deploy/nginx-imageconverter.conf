# /etc/nginx/sites-available/imageconverter.buzznexters.tech
# Reverse proxy for imageconverter.buzznexters.tech -> imageconverter container (127.0.0.1:3002)
#
# Install this first as plain HTTP, then run:
#   sudo certbot --nginx -d imageconverter.buzznexters.tech
# Certbot rewrites this file to add the HTTPS server block + redirect.

server {
    server_name imageconverter.buzznexters.tech;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 80;
    listen [::]:80;
}
